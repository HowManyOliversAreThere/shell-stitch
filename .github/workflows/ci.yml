# Checks every pull request and every push to main. The release build (build.yml) runs these
# same checks first and only builds if they pass.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - run: uv sync --frozen

      - name: Command line starts
        run: uv run --frozen stitch.py --help

      - name: Tests (every setting, against synthetic sections with a known truth)
        run: uv run --frozen pytest -q

      - name: End-to-end self-test (engine and GUI, as run by packaged builds)
        run: uv run --frozen python -m shellstitch.selftest --gui
